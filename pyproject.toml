[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "langgraph-sdlc-platform"
version = "0.1.0"
description = "Infrastructure baseline for LangChain, LangGraph and Langfuse workflows"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "langchain>=1.2,<2.0",
  "langchain-openai>=1.1,<2.0",
  "langfuse>=4.7,<5.0",
  "langgraph>=1.0,<2.0",
  "pydantic-settings>=2.12,<3.0",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.18,<2.0",
  "pytest>=8.4,<9.0",
  "ruff>=0.14,<1.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src"]
