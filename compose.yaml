services:
  app:
    build:
      context: .
    env_file:
      - path: .env
        required: false
    environment:
      PYTHONPATH: /app/src
    volumes:
      - ./src:/app/src
      - ./tests:/app/tests
      - ./evals:/app/evals
      - ../crm-almaz:/work/crm-almaz:ro
      - ./sdlc-input:/work/input:ro
    working_dir: /app
